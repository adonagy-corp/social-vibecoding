# CloudNativePG physical replication reaches PostgreSQL through the host's
# loopback-only SSH forward. Keep this role-specific SCRAM rule before the
# data-volume configuration so it cannot fall through to a broader method.
host replication social_cnpg_replica all scram-sha-256

# Preserve the authentication rules generated when the existing PostgreSQL
# volume was initialized. This wrapper adds one rule; it does not replace the
# platform's current local and Docker-network access policy.
include /var/lib/postgresql/data/pg_hba.conf
