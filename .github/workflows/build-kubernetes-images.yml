name: Build Kubernetes images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kubernetes-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: platform
            context: .
            dockerfile: Dockerfile.kubernetes
          - component: worker
            context: worker
            dockerfile: worker/Dockerfile
          - component: capture
            context: capture
            dockerfile: capture/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.component }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/social-vibecoding-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=social-vibecoding-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=social-vibecoding-${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Record immutable reference
        run: |
          echo '### ${{ matrix.component }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo 'ghcr.io/${{ github.repository_owner }}/social-vibecoding-${{ matrix.component }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
