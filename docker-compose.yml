# Standalone production stack for Usernode Social Vibecoding.
#
# Lives on a dedicated VPS at the domain set in `.env` (USERNODE_DOMAIN).
# Three services: Caddy (TLS + reverse proxy), the platform itself,
# and Postgres for platform data. Child apps are spawned at runtime by
# the platform onto the same Docker network (`usernode-net`), so Caddy
# can reach them by container name without any extra config.
#
# This compose file is consumed by .github/workflows/deploy.yml during
# deploys. For local dev, see README.md.

name: usernode

# ── Platform container (blue-green) ──────────────────────────────────
# The platform runs as two interchangeable colors (usernode-blue /
# usernode-green) for zero-downtime deploys: the new color boots and
# health-checks alongside the live one, Caddy is flipped to it via a
# graceful reload, then the old color drains and stops. See
# scripts/platform-rollout.sh (invoked from scripts/deploy.sh). Both
# colors share this config via the YAML anchor and differ only in name.
#
# Both carry the `usernode` network alias so in-network consumers —
# PLATFORM_INTERNAL_URL=http://usernode:3000 (worker LLM proxies, child
# apps), the Caddy wildcard `default` row, and the error-handler
# fallback — resolve to whichever color(s) are running. Those endpoints
# are stateless, so round-robin across both colors during the brief
# rollout overlap is fine. The apex + access-gate upstreams instead cut
# over atomically via caddy/active/platform-upstream.caddy because they
# carry turn-scoped SSE/WebSocket streams.
x-usernode-platform: &usernode-platform
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-dev}
  # Shared image tag: building either color tags this same image, so the
  # rollout builds once and both color services reference it.
  image: usernode-platform:latest
  restart: unless-stopped
  # Explicit SIGTERM→SIGKILL budget (#711). server.js's cleanup() drains
  # in-flight handlers for up to DRAIN_TIMEOUT_MS (5s) before exiting;
  # this must stay comfortably above that so the drain can finish instead
  # of being SIGKILLed mid-flush. On a blue-green cutover the rollout
  # passes its own (longer) stop grace to `compose stop -t` — this value
  # governs plain restarts. tests/caddy-deploy-grace.test.js pins
  # DRAIN_TIMEOUT_MS <= this value.
  stop_grace_period: 10s
  networks:
    usernode-net:
      aliases:
        - usernode
    # Internal network shared with ONLY the MinIO sidecar (#752): app
    # and staging containers live on usernode-net and must never be
    # able to reach the object store directly — all bytes flow
    # through platform routes.
    usernode-storage: {}
  expose:
    - "3000"
  env_file:
    - ./.env
  environment:
    # Tell the platform which Docker network to spawn child apps on so
    # Caddy can reach them by container name (the Caddyfile's wildcard
    # site maps each hostname to a container name on this network).
    # Read by src/services/{docker,worker}.js. Override DATABASE_URL
    # inline to point at the in-compose Postgres service instead of
    # project-usernode-db. DB_CONTAINER is the name `db-manager.js`
    # `docker exec`'s into to spawn per-app databases — must match the
    # usernode-db service's container_name below.
    DOCKER_NETWORK: usernode-net
    DB_CONTAINER: usernode-db
    # Where the platform reads ambient host-state from — currently
    # just deploy-status.json, written by the deploy script so the
    # /status page can render an in-progress banner. See
    # services/status.js + scripts/deploy.sh.
    USERNODE_RUNTIME_PATH: /var/lib/usernode/runtime
    # Per Phase 2d (SELF-HOSTING.md), the platform's own data
    # lives in `app_usernode_<hex>` instead of the bare `usernode`
    # database. Same `app_<slug>` convention every child app
    # follows, with the hex suffix avoiding a collision with a
    # hypothetical child app slugged `usernode`. The hex is frozen
    # in src/config.js (SELF_APP_DB_NAME) and must match this URL.
    # The bare `usernode` database stays around as the postgres-
    # bookkeeping target db-manager.js issues `CREATE DATABASE`
    # from when it spawns child-app DBs.
    DATABASE_URL: postgres://usernode:${USERNODE_DB_PASSWORD}@usernode-db:5432/app_usernode_2d5619
    NODE_RPC_URL: http://usernode-node:3000
    # App file storage (#752): the MinIO sidecar, reachable only
    # over the internal usernode-storage network. Credentials
    # (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD) arrive via env_file.
    MINIO_ENDPOINT: http://usernode-minio:9000
    # Elect a single leader across the two colors so singleton background
    # work (worker adoption, headless resume, recovery, sweepers, drift
    # poller) never double-runs during the rollout overlap. See
    # src/services/leadership.js. Unset in dev/tests → leader immediately.
    PLATFORM_LEADER_LOCK: "1"
  volumes:
    # Required: the platform spawns child-app containers via the
    # host Docker daemon. Standard Usernode pattern.
    - /var/run/docker.sock:/var/run/docker.sock
    # Read-only host bind for deploy signals (see scripts/deploy.sh).
    # The deploy user on the host writes /opt/usernode/runtime/
    # deploy-status.json; the platform reads it from in-container.
    - /opt/usernode/runtime:/var/lib/usernode/runtime:ro
    # The ONE writable exception, scoped to a subdirectory: after a
    # self-app merge the platform touches a nudge file here and the
    # host deployer (scripts/usernode-deployer.sh) runs its git poll
    # immediately instead of waiting out its ~2-min baseline. A hint,
    # not an authority — the deployer still deploys only what
    # github.com says main points at (src/services/deploy-nudge.js).
    # Either color may write it (whichever served the merge request).
    - /opt/usernode/runtime/deploy-nudge:/var/lib/usernode/deploy-nudge
  depends_on:
    usernode-db:
      condition: service_healthy
    usernode-node:
      condition: service_started
    # service_started, NOT service_healthy: a wedged MinIO must
    # degrade file uploads to a clear storage_unavailable error, never
    # block the whole platform from booting. The storage service
    # lazily (re)ensures its bucket per call. See services/app-files.js.
    usernode-minio:
      condition: service_started
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
    interval: 30s
    timeout: 5s
    retries: 3
  deploy:
    resources:
      # The single platform process is the funnel for ALL HTTP, every
      # SSE chat stream (Mayor token relay + CC progress), all WebSocket
      # fan-out, and Docker orchestration. Both colors briefly run
      # together during a rollout (~2x peak), which the box has headroom
      # for. Sized for the ~50-concurrent-user target; see scaling notes.
      limits:
        memory: 3g
        cpus: "4"
  security_opt:
    - no-new-privileges:true

services:
  caddy:
    # Custom build: stock caddy ships no DNS plugins, and DNS-01 issuance of
    # the *.social-vibecoding wildcard cert needs caddy-dns/acmedns. See
    # caddy.Dockerfile + acme-dns/config.cfg.
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: usernode-caddy:acmedns
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Blue/green active-color snippet imported by the Caddyfile.
      # Rewritten on the host by scripts/platform-rollout.sh and picked
      # up via a graceful `caddy reload` on each zero-downtime deploy.
      # Read-only in the container — only the deploy (host side) writes it.
      - ./caddy/active:/etc/caddy/active:ro
      # caddy-data holds the on-demand-issued certs + ACME account state
      # (ZeroSSL primary, Let's Encrypt fallback). Persist it so
      # restarts/deploys reuse existing certs instead of re-issuing (which
      # would risk ACME rate limits). There is no shared route-config volume
      # any more: the wildcard site in the Caddyfile maps hostnames to
      # container names dynamically, so adding/removing an app or preview
      # needs no Caddy-side state.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Caddyfile uses {$USERNODE_DOMAIN} substitution for the main
      # vhost. Must be set in Caddy's process env at config-load time.
      USERNODE_DOMAIN: ${USERNODE_DOMAIN}
      # ZeroSSL ACME EAB (External Account Binding) credentials, consumed by
      # the `cert_issuer acme https://acme.zerossl.com/...` block in the
      # Caddyfile. Derived once from the ZeroSSL API key (see Caddyfile note)
      # and reusable. ZeroSSL is the primary issuer; LE (no creds needed) is
      # the fallback. Empty is fine for local/self-host — Caddy falls through
      # to LE. (ZEROSSL_API_KEY is no longer read by Caddy; kept in .env only
      # for regenerating EAB creds if they're ever revoked.)
      ZEROSSL_EAB_KID: ${ZEROSSL_EAB_KID:-}
      ZEROSSL_EAB_HMAC: ${ZEROSSL_EAB_HMAC:-}
      # acme-dns credentials for the *.social-vibecoding wildcard DNS-01
      # challenge, consumed by the `tls { dns acmedns ... }` block in the
      # Caddyfile. The API base points at the internal acme-dns service (not
      # publicly exposed). Username/password/subdomain come from a one-time
      # `POST /register` against acme-dns and are persisted into .env by the
      # deploy workflow. Empty until registration is done (Caddy then just
      # keeps using its current on-demand path).
      ACME_DNS_API_BASE_URL: http://acme-dns:8081
      ACME_DNS_USERNAME: ${ACME_DNS_USERNAME:-}
      ACME_DNS_PASSWORD: ${ACME_DNS_PASSWORD:-}
      ACME_DNS_SUBDOMAIN: ${ACME_DNS_SUBDOMAIN:-}
    networks:
      - usernode-net
    healthcheck:
      # Probe the admin API on the IPv4 loopback explicitly. The admin
      # endpoint binds 127.0.0.1:2019 only, but the container also has IPv6,
      # so `localhost` resolves to ::1 first and the probe gets "connection
      # refused" — leaving caddy perpetually `unhealthy` despite serving fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # Self-hosted DNS server that answers ONLY the ACME DNS-01 challenge for our
  # wildcard cert. We delegate `_acme-challenge.social-vibecoding...` to it via
  # a single static CNAME so Caddy's DNS-01 writes never touch the production
  # Namecheap zone (whose only write API replaces the whole zone per call).
  # Only :53 is public (for CA challenge lookups); the HTTP API (:8081) is
  # internal-only — reachable by Caddy over the docker network.
  acme-dns:
    image: joohoi/acme-dns:v1.0
    container_name: acme-dns
    restart: unless-stopped
    ports:
      # Bind to the public IP explicitly, NOT 0.0.0.0. The host runs
      # systemd-resolved on 127.0.0.53:53, and a wildcard 0.0.0.0:53 publish
      # collides with that loopback bind ("address already in use"), which is
      # what aborted the first deploy. The CA only ever queries acme-dns over
      # the public IPv4 (the NS glue is an A record), so this is exactly the
      # interface we need. If the server IP changes, update here + the glue A
      # in acme-dns/config.cfg + the Namecheap delegation.
      - "144.76.85.53:53:53/udp"
      - "144.76.85.53:53:53/tcp"
    volumes:
      - ./acme-dns/config.cfg:/etc/acme-dns/config.cfg:ro
      - acme-dns-data:/var/lib/acme-dns
    networks:
      - usernode-net
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  # Platform colors. See the x-usernode-platform anchor above for the full
  # (shared) config — the two services differ only in name. Exactly one is
  # normally running; both run briefly during a zero-downtime rollout,
  # which is driven by scripts/platform-rollout.sh (NOT a plain
  # `compose up`, which would start both at once — deploy.sh brings infra
  # up with an explicit service list for exactly that reason). `hostname`
  # makes the leader-election logs (os.hostname() in
  # services/leadership.js) say which color is talking.
  usernode-blue:
    <<: *usernode-platform
    container_name: usernode-blue
    hostname: usernode-blue

  usernode-green:
    <<: *usernode-platform
    container_name: usernode-green
    hostname: usernode-green

  usernode-db:
    image: postgres:17-alpine
    container_name: usernode-db
    restart: unless-stopped
    # Postgres parallel workers + pg_restore (staging DB clones) allocate
    # dynamic shared memory under /dev/shm. Docker's default 64m ceiling
    # filled up with leaked segments from crashed workers (2026-07-07
    # incident: every staging build failed with "could not resize shared
    # memory segment ... No space left on device", wedging all open
    # proposals' checks). 1g gives routine restore parallelism real
    # headroom so a single busy day can't wedge staging again.
    shm_size: 1gb
    # max_wal_size: the postgres default (1GB) is far too small for this
    # instance's write bursts — each staging-preview build pg_restores a
    # ~10 GB platform-DB clone, and during the 2026-07-30 deploy failure
    # the server was checkpointing every 6-9 SECONDS (postgres itself
    # logging "checkpoints are occurring too frequently ... Consider
    # increasing max_wal_size"), each pass flushing 600-900 MB. Constant
    # checkpointing turns every restore into an I/O storm that starves
    # everything else (boot migrations included). 8GB spaces checkpoints
    # back out toward the checkpoint_timeout cadence at the cost of up to
    # ~8GB extra WAL on disk and proportionally longer crash recovery.
    command:
      - postgres
      - -c
      - max_wal_size=8GB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    # CloudNativePG reaches this listener only after authenticating to the
    # host's restricted SSH forward. Never publish PostgreSQL on a public
    # interface; the platform continues to use usernode-db:5432 internally.
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - usernode-net
    volumes:
      - usernode-db-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.replication.conf:/etc/postgresql/pg_hba.conf:ro
    # Kept separate from the platform's .env so the replication credential
    # reaches only PostgreSQL. deploy.sh creates and preserves this mode-0600
    # runtime file before any Compose operation.
    env_file:
      - ./runtime/cnpg-replication.env
    environment:
      POSTGRES_DB: usernode
      POSTGRES_USER: usernode
      POSTGRES_PASSWORD: ${USERNODE_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usernode"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        # Backs platform data + every per-app and per-staging database
        # (pg_dump/restore clones). Raised from 512m/1-CPU to absorb ~50
        # sessions' query load + staging clone churn. Note: a wider pg
        # Pool.max (DB_POOL_MAX) leans harder on this — keep them in step.
        limits:
          memory: 4g
          cpus: "4"
    security_opt:
      - no-new-privileges:true

  # Object storage for app file uploads (#752): user photos apps store
  # via usernode.uploadFile() / the /api/app-storage API. Bytes live
  # here (bucket `usernode-app-files`, keys `app/<app_id>/<file_id>`);
  # metadata/quotas live in Postgres (app_files). Deliberately NOT on
  # usernode-net — app and staging containers share that network and
  # must never reach the object store; only the platform (which proxies
  # every read and write) joins the internal usernode-storage network,
  # and no ports are published. Credentials are generated once at
  # rollout into .env (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD), same
  # handling as USERNODE_DB_PASSWORD.
  usernode-minio:
    # Pinned release, never :latest — same stance as postgres:17-alpine.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: usernode-minio
    restart: unless-stopped
    command: server /data
    networks:
      - usernode-storage
    volumes:
      - usernode-minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    healthcheck:
      # `mc ready local` is MinIO's documented container healthcheck —
      # the bundled mc client with the image's auto-configured `local`
      # alias (curl is not guaranteed in the image).
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true

  usernode-node:
    image: usernodelabs/usernode
    container_name: usernode-node
    restart: unless-stopped
    networks:
      - usernode-net
    environment:
      # Names must match what the `usernode node` clap parser reads:
      # `--genesis-url` / `USERNODE_GENESIS_URL` and `--peer-list-url` /
      # `PEER_LIST_URL` (see crates/cli/src/commands/node.rs in usernode).
      # If these don't match, the binary silently falls back to its
      # built-in defaults (which include a stale baked-in seedlist
      # pointing at long-gone peers), so the node sits in `Connecting`
      # forever and every dapp shows the loading overlay indefinitely.
      # The outer `${GENESIS_URL:-...}` / `${SEEDLIST_URL:-...}` lets an
      # operator override the upstream defaults from the host env / .env.
      USERNODE_GENESIS_URL: ${GENESIS_URL:-https://static.usernodelabs.org/testnet/genesis.json}
      PEER_LIST_URL: ${SEEDLIST_URL:-https://static.usernodelabs.org/testnet/seedlist.txt}
      RUST_LOG: info
    # `--archive --archive-path /archive` makes the sidecar a true
    # full-ledger node (fixes PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG —
    # RecentTxEntry.source goes null for ~half the incoming txs because
    # the partial UTXO tree can't resolve commitments belonging to
    # non-tracked owners). Child apps register their own pubkeys at
    # runtime via `POST /wallet/tracked_owner/add`, which trips the
    # wallet-seed shortcut into partial-ledger overlay mode by default;
    # the archive flag overrides that and keeps the node in full mode.
    #
    # The deploy workflow seeds the `usernode-node-archive` volume with
    # a fresh snapshot from a seed node before bringing the stack up;
    # from then on the node both LOADS that snapshot at boot AND WRITES
    # new ones at the snapshot interval, so subsequent restarts (and
    # even deploys that skip the fetch) recover from whatever's on disk.
    #
    # `--enable-recent-tx-stream` is the CLI form of the older
    # USERNODE_ENABLE_RECENT_TX_STREAM env var; both work, the flag is
    # what dapp-starter uses so we match.
    command:
      - "--work-dir"
      - "/var/lib/usernode"
      - "--archive"
      - "--archive-path"
      - "/archive"
      - "--port"
      - "3000"
      - "--enable-recent-tx-stream"
    volumes:
      - usernode-node-data:/var/lib/usernode
      - usernode-node-archive:/archive
    deploy:
      resources:
        # Shared full-ledger chain node for every dapp. Observed pinned at
        # ~99.8% of the old 2g limit at idle (before any dev-session load),
        # so this was already a saturation/OOM risk. Raised to 4g + a 2nd
        # CPU to give headroom as app + session count grows.
        limits:
          memory: 4g
          cpus: "2"
    security_opt:
      - no-new-privileges:true

networks:
  usernode-net:
    name: usernode-net
    driver: bridge
  # Internal-only network for the platform ↔ MinIO hop (#752). Child
  # app / staging / worker containers are spawned onto usernode-net and
  # can never route here.
  usernode-storage:
    name: usernode-storage
    driver: bridge
    internal: true

volumes:
  caddy-data:
  caddy-config:
  # acme-dns sqlite db (registered account + current challenge TXT). Persist
  # so the registered account survives restarts/deploys.
  acme-dns-data:
  usernode-db-data:
  # Sidecar node working directory (chain-scoped wallet cache, etc.) and
  # archive root (manifest + snapshot binprots + block tail). Both must
  # be persistent — without persistence every restart re-syncs from
  # genesis (~15 min on testnet) and every deploy loses the archive
  # snapshot, dropping the node back to partial-ledger mode for the
  # duration. See the usernode-node service comment.
  usernode-node-data:
  usernode-node-archive:
  # App file-storage bytes (#752). MUST be included in host-level
  # backups alongside usernode-db-data: the pg_dump-based scripts only
  # cover metadata, and a restore without this volume degrades every
  # stored image to a 404. See SELF-HOSTING.md "App file storage".
  usernode-minio-data:
