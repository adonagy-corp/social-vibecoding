{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-default-deny
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-platform
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.internalCallerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "social-vibecoding-platform.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgresql
      ports: [{protocol: TCP, port: 5432}]
    {{- if .Values.networkPolicy.nodeRpc.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.nodeRpc.namespace is required when nodeRpc access is enabled" .Values.networkPolicy.nodeRpc.namespace | quote }}
          {{- with .Values.networkPolicy.nodeRpc.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.nodeRpc.port }}
    {{- end }}
    {{- if .Values.networkPolicy.explorer.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.explorer.namespace is required when explorer access is enabled" .Values.networkPolicy.explorer.namespace | quote }}
          {{- with .Values.networkPolicy.explorer.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.explorer.port }}
    {{- end }}
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-migration
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migration
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "social-vibecoding-platform.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgresql
      ports: [{protocol: TCP, port: 5432}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-postgresql
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "social-vibecoding-platform.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: platform
        - podSelector:
            matchLabels:
              {{- include "social-vibecoding-platform.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: migration
        {{- range .Values.networkPolicy.databaseCallerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: social-vibecoding-runtime
              app.kubernetes.io/part-of: social-vibecoding
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
{{- if .Values.networkPolicy.ciliumApiServerEgress }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-kube-apiserver
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  endpointSelector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
{{- end }}
{{- end }}
