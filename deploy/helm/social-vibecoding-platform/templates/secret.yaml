{{- include "social-vibecoding-platform.validate" . }}
{{- if and .Values.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.username .Values.secrets.databasePassword (include "social-vibecoding-platform.fullname" .) .Values.postgresql.applicationDatabase | quote }}
  DB_ADMIN_URL: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.username .Values.secrets.databasePassword (include "social-vibecoding-platform.fullname" .) .Values.postgresql.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  DATA_ENCRYPTION_KEY: {{ .Values.secrets.dataEncryptionKey | quote }}
  JWT_SECRET: {{ .Values.secrets.dataEncryptionKey | quote }}
  IFRAME_JWT_PRIVATE_KEY: {{ .Values.secrets.iframeJwtPrivateKey | quote }}
  IFRAME_JWT_PUBLIC_KEY: {{ .Values.secrets.iframeJwtPublicKey | quote }}
  WORKER_JWT_SECRET: {{ .Values.secrets.workerJwtSecret | quote }}
  EDGE_JWT_SECRET: {{ .Values.secrets.edgeJwtSecret | quote }}
  GITHUB_APP_ID: {{ .Values.secrets.githubAppId | quote }}
  GITHUB_PRIVATE_KEY: {{ .Values.secrets.githubPrivateKey | quote }}
  GITHUB_BOT_TOKEN: {{ .Values.secrets.githubBotToken | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  ANTHROPIC_ADMIN_KEY: {{ .Values.secrets.anthropicAdminKey | quote }}
{{- end }}
