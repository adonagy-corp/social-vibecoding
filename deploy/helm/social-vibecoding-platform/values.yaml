enabled: false

nameOverride: ""
fullnameOverride: social-vibecoding

imagePullSecrets: []

# DNS suffix used for cross-namespace Service addresses. Keep this aligned
# with the Kubernetes cluster's configured cluster domain.
clusterDomain: cluster.local

# Populated in values.release.yaml by the image build workflow before the
# immutable OCI chart is packaged. Cluster values must not override it.
release:
  sourceRevision: ""

platform:
  replicas: 1
  image:
    repository: ghcr.io/replace-me/social-vibecoding-platform
    digest: ""
    pullPolicy: IfNotPresent
  workerImage:
    repository: ghcr.io/replace-me/social-vibecoding-worker
    digest: ""
  captureImage:
    repository: ghcr.io/replace-me/social-vibecoding-capture
    digest: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: "4"
      memory: 3Gi
      ephemeral-storage: 4Gi
  tmpSizeLimit: 2Gi

postgresql:
  image:
    repository: postgres
    tag: 17-bookworm
    digest: sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
    pullPolicy: IfNotPresent
  database: usernode
  applicationDatabase: app_usernode_2d5619
  username: usernode
  storage:
    size: 50Gi
    storageClassName: openebs-lvm-retain
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  sharedMemorySizeLimit: 1Gi

migration:
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 2Gi

config:
  # Canonical platform host and generated-application suffix. Generated apps
  # are addressed as <slug>.<domain>.
  domain: social-vibecoding.example.invalid
  platformRepository: https://github.com/replace-me/social-vibecoding
  nodeRpcUrl: http://replace-me.invalid:3000
  # Explorer host[:port] without a scheme. Public hosts use HTTPS; private
  # numeric addresses use HTTP, matching the platform's existing proxy logic.
  explorerUpstream: testnet-explorer.usernodelabs.org
  explorerUpstreamBase: /api
  explorerUseHttp: false
  internalUrl: http://social-vibecoding.social-platform.svc.cluster.local:3000
  logLevel: INFO
  workerMemory: 2g
  workerCpus: "2"

secrets:
  create: false
  existingSecret: social-vibecoding
  databasePassword: ""
  adminUsername: ""
  adminPassword: ""
  sessionSecret: ""
  dataEncryptionKey: ""
  iframeJwtPrivateKey: ""
  iframeJwtPublicKey: ""
  workerJwtSecret: ""
  edgeJwtSecret: ""
  githubAppId: ""
  githubPrivateKey: ""
  githubBotToken: ""
  anthropicApiKey: ""
  anthropicAdminKey: ""

ingress:
  enabled: true
  className: cilium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-public
    ingress.cilium.io/loadbalancer-mode: shared
  tls:
    enabled: true
    secretName: social-vibecoding-tls

networkPolicy:
  enabled: true
  ciliumApiServerEgress: true
  # Optional cross-namespace access to the selected UserNode HTTP endpoint.
  # Keep the Pod selector specific so the platform cannot reach every workload
  # in the network namespace merely because it needs one node's /status API.
  nodeRpc:
    enabled: false
    namespace: ""
    port: 3000
    podSelector: {}
  explorer:
    enabled: false
    namespace: ""
    port: 3080
    podSelector: {}
  # Generated apps and workers call authenticated internal platform APIs.
  internalCallerNamespaces:
    - social-apps
    - social-workers
  # Generated applications connect directly to their dedicated PostgreSQL
  # databases using per-database roles. Workers do not require database access.
  databaseCallerNamespaces:
    - social-apps

podDisruptionBudget:
  enabled: true
