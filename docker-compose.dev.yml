# Local development stack.
#
# Usage (or `make up` from the repo root):
#   docker compose -f docker-compose.dev.yml up --build
#
# Then visit http://localhost:3000.
#
# This mirrors the production compose's child-app spawning model:
# the platform shells out to the host's Docker daemon (mounted
# /var/run/docker.sock) and places child apps on the named network
# below so it can reach them by container name. In dev each child
# app also publishes to a random localhost port — that's what the
# user clicks when USERNODE_LOCAL_DEV=1 is set in .env.

services:
  app:
    build:
      context: .
      # The host uses a loopback DNS proxy. Docker otherwise replaces it
      # with unreachable public resolvers during RUN steps, which makes apk
      # report misleading "no such package" errors after index downloads
      # fail. Host networking is build-only; the running app still uses the
      # isolated usernode-net network below.
      network: host
    container_name: vibecoding-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://usernode:localdev@db:5432/usernode
      # Used by db-manager.connectionUrl() to build per-app child
      # DATABASE_URLs. The local postgres container is bootstrapped
      # with POSTGRES_PASSWORD=localdev (see `db.environment` below)
      # and that's the only password it accepts. We pin this here
      # rather than reading it from .env so the child URLs always
      # match the local DB even when .env carries a prod-flavored
      # value (e.g. the file was copied from a deploy or generated
      # fresh by `make secrets`). Without this override, child apps
      # crashloop on `28P01 password authentication failed` and the
      # rebuild aborts after 30 healthcheck attempts.
      USERNODE_DB_PASSWORD: localdev
      LOG_LEVEL: DEBUG
      CLI_CANONICAL_ORIGIN: http://localhost:3000
      # Sidecar node can't sync via WebRTC inside Docker Desktop for Mac.
      # Run the node natively in another terminal — `make node-full` in this
      # repo handles the archive fetch + boot on the right port (3001,
      # picked to avoid conflict with this container's own host:3000
      # mapping).
      NODE_RPC_URL: http://host.docker.internal:3001
      # Tell the platform which Docker network to attach child app
      # containers to. Must match the network this service is on so
      # `docker exec <child> wget …` works for healthchecks. Same name
      # as the prod compose so behavior matches.
      DOCKER_NETWORK: usernode-net
      # Internal URL workers + child apps use to reach the platform
      # over `usernode-net`. Defaults to `http://usernode:3000` (the
      # prod container name); in dev the platform runs as
      # `vibecoding-dev`, so the default fails DNS from inside spawned
      # containers. Specifically the Anthropic proxy: workers set
      # ANTHROPIC_BASE_URL=${PLATFORM_INTERNAL_URL}/api/internal/anthropic
      # for non-BYOK turns, and without this override `claude` errors
      # with `ENOTFOUND usernode` and the spec just shows
      # "Unable to connect to API". See src/services/worker.js.
      PLATFORM_INTERNAL_URL: http://vibecoding-dev:3000
      # App file storage (#752): local MinIO sidecar with fixed dev
      # credentials (mirrors the prod usernode-minio service; dev skips
      # the separate internal network — everything is localhost anyway).
      MINIO_ENDPOINT: http://vibecoding-minio-dev:9000
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: localdev-minio-secret
    command: sh -c "node scripts/restore-image-assets.js && exec node --watch --watch-path=server.js --watch-path=src server.js"
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./server.js:/app/server.js
      # `worker/` is the source for the worker container image (built
      # via `ensureWorkerImage()` → `docker build /app/worker`). Without
      # this bind mount, host-side edits to worker-run.sh / run-cc.sh
      # never reach the dev container's /app/worker copy, so the
      # rebuilt worker image keeps shipping the version baked in at
      # `docker compose build` time. Mounting it live lets edits flow
      # straight through to the next `ensureWorkerImage()` call.
      - ./worker:/app/worker
      # Required: the platform spawns child-app containers via the
      # host Docker daemon. Without this the container hits
      # "spawn docker ENOENT" / connection refused on every
      # docker.execFile call.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - usernode-net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: vibecoding-db-dev
    restart: unless-stopped
    ports:
      - "5440:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: usernode
      POSTGRES_USER: usernode
      POSTGRES_PASSWORD: localdev
    networks:
      - usernode-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usernode"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local mirror of prod's usernode-minio object-store sidecar (#752).
  # Fixed dev credentials (matching the app service's env above); no
  # published ports needed — the platform reaches it by container name.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vibecoding-minio-dev
    restart: unless-stopped
    command: server /data
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: localdev-minio-secret
    networks:
      - usernode-net

networks:
  # Same name as production so the DOCKER_NETWORK env var matches and
  # behavior is consistent. Child apps will be added here at runtime
  # by the platform via `docker run --network usernode-net`.
  usernode-net:
    name: usernode-net
    driver: bridge

volumes:
  db-data:
  minio-data:
